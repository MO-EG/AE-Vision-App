<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AE Vision - الطالب</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --accent: #e2b04a;
            --text: #e6e6e6;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            background: #1a1a2e;
            padding: 16px;
            text-align: center;
            border-bottom: 3px solid var(--accent);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 {
            color: var(--accent);
            font-size: 24px;
        }
        .logout-btn {
            background: #b22222;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-size: 14px;
            transition: 0.2s;
        }
        .logout-btn:hover {
            background: #8b1a1a;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 16px;
            flex: 1;
        }

        #reader {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            margin: 16px 0;
        }

        .section-card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            margin: 12px 0;
            text-align: center;
            cursor: pointer;
            border-right: 4px solid var(--accent);
            font-size: 20px;
            font-weight: bold;
            transition: 0.2s;
        }
        .section-card:hover {
            background: #1e2530;
            transform: translateX(-4px);
        }

        .sub-card {
            background: var(--card);
            border-radius: 12px;
            padding: 16px;
            margin: 10px 0;
            text-align: center;
            cursor: pointer;
            border-right: 4px solid #4a9eff;
            font-size: 18px;
            transition: 0.2s;
        }
        .sub-card:hover {
            background: #1e2530;
            transform: translateX(-4px);
        }

        .book-card {
            background: var(--card);
            border-radius: 12px;
            padding: 12px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            gap: 12px;
            position: relative;
            transition: 0.2s;
        }
        .book-card:hover {
            background: #1e2530;
        }
        .book-card img {
            width: 80px;
            height: 80px;
            border-radius: 8px;
            object-fit: cover;
            background: #333;
            flex-shrink: 0;
        }
        .book-info {
            flex: 1;
            min-width: 0;
        }
        .book-title {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 8px;
            word-wrap: break-word;
        }

        .download-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-size: 14px;
            font-weight: bold;
            white-space: nowrap;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .download-btn:hover {
            background: #218838;
            transform: scale(1.05);
        }
        .download-btn:active {
            transform: scale(0.95);
        }

        .back-btn {
            background: #555;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            margin: 10px 0;
            cursor: pointer;
            font-family: 'Tajawal', sans-serif;
            font-size: 14px;
            transition: 0.2s;
        }
        .back-btn:hover {
            background: #666;
        }

        .loading-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            gap: 16px;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 4px solid rgba(226, 176, 74, 0.2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            color: #aaa;
            font-size: 16px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .fade-in {
            animation: fadeIn 0.35s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: #fff;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            font-family: 'Tajawal', sans-serif;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
        }
        .toast.show { opacity: 1; }
        .toast.success { background: #28a745; }
        .toast.error { background: #b22222; }

        .popup {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .popup.active {
            display: flex;
        }
        .popup-card {
            background: var(--card);
            border-radius: 20px;
            padding: 24px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            animation: slideUp 0.3s ease;
            max-height: 85vh;
            overflow-y: auto;
            border: 2px solid var(--accent);
        }
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @media (max-width: 400px) {
            .book-card { flex-wrap: wrap; }
            .book-card img { width: 60px; height: 60px; }
            .download-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="toast" id="toast"></div>

    <div class="popup" id="alertModal">
        <div class="popup-card">
            <h3 style="color:var(--accent); margin-bottom:16px;">تنبيه</h3>
            <p id="alertMessage" style="margin-bottom:20px; font-size:16px;"></p>
            <button onclick="closeAlert()" style="background:var(--accent); border:none; padding:10px 24px; border-radius:20px; color:#000; font-weight:bold; cursor:pointer; width:100%;">حسنًا</button>
        </div>
    </div>

    <div id="scanPage" style="width:100%">
        <div class="header"><h1>AE Vision</h1><div></div></div>
        <div class="container">
            <div id="reader"></div>
            <p style="text-align:center; color:#aaa;">📷 وجه الكاميرا نحو الباركود</p>
        </div>
    </div>

    <div id="mainPage" style="display:none; width:100%">
        <div class="header"><h1>AE Vision</h1><button class="logout-btn" onclick="logout()">🚪 خروج</button></div>
        <div class="container">
            <div class="section-card fade-in" onclick="showGrades('primary')">📘 ابتدائي</div>
            <div class="section-card fade-in" onclick="showGrades('prep')">📙 اعدادي</div>
            <div class="section-card fade-in" onclick="showGrades('secondary')">📕 ثانوي</div>
            <div class="section-card fade-in" onclick="showAlbums()" style="border-right-color:#a855f7;">🗂 الألبومات</div>
        </div>
    </div>

    <div id="gradePage" style="display:none; width:100%">
        <div class="header"><h1 id="gradeTitle">الصفوف</h1><button class="logout-btn" onclick="logout()">🚪 خروج</button></div>
        <div class="container">
            <button class="back-btn" onclick="goBack('main')">← رجوع</button>
            <div id="gradesContainer"></div>
        </div>
    </div>

    <div id="albumsPage" style="display:none; width:100%">
        <div class="header"><h1>🗂 الألبومات</h1><button class="logout-btn" onclick="logout()">🚪 خروج</button></div>
        <div class="container">
            <button class="back-btn" onclick="goBack('main')">← رجوع</button>
            <div id="albumsContainer"></div>
        </div>
    </div>

    <div id="booksPage" style="display:none; width:100%">
        <div class="header"><h1 id="booksTitle">الكتب</h1><button class="logout-btn" onclick="logout()">🚪 خروج</button></div>
        <div class="container">
            <button class="back-btn" onclick="goBack('booksBack')">← رجوع</button>
            <div id="booksContainer"></div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyis7KXF90SgojdxtzLg1IB5waVITn3ktHUUUjBz8StQxatSE-tZySlify8oPGXj2J5/exec";
        let html5QrCode;
        let currentCategory = null;
        let currentAlbumId = null;
        let currentAlbumName = '';
        const booksCache = {};
        const albumsCache = {};

        const gradesMap = {
            primary: ["4 ابتدائي", "5 ابتدائي", "6 ابتدائي"],
            prep: ["1 اعدادي", "2 اعدادي", "3 اعدادي"],
            secondary: ["1 ثانوي", "2 ثانوي", "3 ثانوي"]
        };

        function showPage(p) {
            document.getElementById('scanPage').style.display = p === 'scan' ? 'block' : 'none';
            document.getElementById('mainPage').style.display = p === 'main' ? 'block' : 'none';
            document.getElementById('gradePage').style.display = p === 'grades' ? 'block' : 'none';
            document.getElementById('albumsPage').style.display = p === 'albums' ? 'block' : 'none';
            document.getElementById('booksPage').style.display = p === 'books' ? 'block' : 'none';
        }

        function showMainPage() {
            showPage('main');
            currentCategory = null;
            currentAlbumId = null;
        }

        function showGrades(category) {
            currentCategory = category;
            const titles = { primary: 'ابتدائي', prep: 'اعدادي', secondary: 'ثانوي' };
            document.getElementById('gradeTitle').textContent = titles[category];
            document.getElementById('gradesContainer').innerHTML = gradesMap[category].map((g, i) =>
                `<div class="sub-card fade-in" style="animation-delay:${i*0.05}s" onclick="showBooks('${category}', '${g.replace(/'/g, "\\'")}')">${g}</div>`
            ).join('');
            showPage('grades');
        }

        async function showAlbums() {
            document.getElementById('albumsContainer').innerHTML = `
                <div class="loading-container fade-in">
                    <div class="spinner"></div>
                    <div class="loading-text">⏳ جاري التحميل...</div>
                </div>`;
            showPage('albums');

            if (albumsCache['all']) {
                renderAlbums(albumsCache['all']);
                return;
            }

            try {
                const resp = await fetch(SCRIPT_URL + "?action=getAlbums");
                const albums = await resp.json();
                albumsCache['all'] = albums;
                renderAlbums(albums);
            } catch (err) {
                document.getElementById('albumsContainer').innerHTML = `
                    <div class="loading-container fade-in">
                        <div style="font-size:32px;">⚠️</div>
                        <div class="loading-text" style="color:#e74c3c;">تعذر تحميل الألبومات</div>
                        <button class="back-btn" onclick="goBack('main')">← رجوع</button>
                    </div>`;
            }
        }

        function renderAlbums(albums) {
            const container = document.getElementById('albumsContainer');
            if (!albums || albums.length === 0) {
                container.innerHTML = `
                    <div class="loading-container fade-in">
                        <div style="font-size:40px;">📭</div>
                        <p style="color:#aaa;">لا توجد ألبومات</p>
                    </div>`;
                return;
            }
            container.innerHTML = albums.map((album, i) => `
                <div class="sub-card fade-in" style="animation-delay:${i*0.05}s; border-right-color:#a855f7;" onclick="showAlbumBooks('${album.id}', '${album.name.replace(/'/g, "\\'")}')">
                    🗂 ${album.name}
                </div>
            `).join('');
        }

        async function showBooks(category, grade) {
            document.getElementById('booksTitle').textContent = grade;
            const container = document.getElementById('booksContainer');
            container.innerHTML = `
                <div class="loading-container fade-in">
                    <div class="spinner"></div>
                    <div class="loading-text">⏳ جاري التحميل...</div>
                </div>`;
            showPage('books');

            const cacheKey = `cat_${category}_${grade}`;
            if (booksCache[cacheKey]) {
                renderBooks(booksCache[cacheKey], container);
                window._booksBack = 'grades';
                return;
            }

            try {
                const resp = await fetch(SCRIPT_URL + `?action=getBooks&category=${category}&grade=${encodeURIComponent(grade)}`);
                const books = await resp.json();
                booksCache[cacheKey] = books;
                window._booksBack = 'grades';
                renderBooks(books, container);
            } catch (err) {
                console.error("خطأ في جلب الكتب:", err);
                container.innerHTML = `
                    <div class="loading-container fade-in">
                        <div style="font-size:32px;">⚠️</div>
                        <div class="loading-text" style="color:#e74c3c;">تعذر تحميل الكتب. حاول مرة أخرى.</div>
                        <button class="back-btn" onclick="goBack('grades')">← رجوع</button>
                    </div>`;
            }
        }

        async function showAlbumBooks(albumId, albumName) {
            currentAlbumId = albumId;
            currentAlbumName = albumName;
            document.getElementById('booksTitle').textContent = albumName;
            const container = document.getElementById('booksContainer');
            container.innerHTML = `
                <div class="loading-container fade-in">
                    <div class="spinner"></div>
                    <div class="loading-text">⏳ جاري التحميل...</div>
                </div>`;
            showPage('books');

            const cacheKey = `album_${albumId}`;
            if (booksCache[cacheKey]) {
                window._booksBack = 'albums';
                renderBooks(booksCache[cacheKey], container);
                return;
            }

            try {
                const resp = await fetch(SCRIPT_URL + `?action=getBooks&albumId=${albumId}`);
                const books = await resp.json();
                booksCache[cacheKey] = books;
                window._booksBack = 'albums';
                renderBooks(books, container);
            } catch (err) {
                console.error("خطأ في جلب كتب الألبوم:", err);
                container.innerHTML = `
                    <div class="loading-container fade-in">
                        <div style="font-size:32px;">⚠️</div>
                        <div class="loading-text" style="color:#e74c3c;">تعذر تحميل الكتب</div>
                        <button class="back-btn" onclick="goBack('albums')">← رجوع</button>
                    </div>`;
            }
        }

        function renderBooks(books, container) {
            if (!books || books.length === 0) {
                container.innerHTML =
                    '<div class="loading-container fade-in"><div style="font-size:40px;">📭</div><p style="color:#aaa;">لا توجد كتب</p></div>';
                return;
            }
            container.innerHTML = books.map((b, i) => {
                const imgSrc = b.image || 'logo.png';
                const bookName = b.name || 'ملف بدون اسم';
                const bookLink = b.link || '';
                return `
                    <div class="book-card fade-in" style="animation-delay:${i*0.04}s">
                        <img src="${imgSrc}" onerror="this.src='logo.png'" alt="صورة الكتاب" loading="lazy">
                        <div class="book-info">
                            <div class="book-title">${bookName}</div>
                        </div>
                        <button class="download-btn" onclick="downloadBook(event, '${bookLink.replace(/'/g, "\\'")}', '${bookName.replace(/'/g, "\\'")}')">
                            ⬇️ تحميل
                        </button>
                    </div>`;
            }).join('');
        }

        function goBack(target) {
            if (target === 'main') {
                showMainPage();
            } else if (target === 'grades') {
                if (currentCategory) {
                    const titles = { primary: 'ابتدائي', prep: 'اعدادي', secondary: 'ثانوي' };
                    document.getElementById('gradeTitle').textContent = titles[currentCategory];
                    document.getElementById('gradesContainer').innerHTML = gradesMap[currentCategory].map((g, i) =>
                        `<div class="sub-card fade-in" style="animation-delay:${i*0.05}s" onclick="showBooks('${currentCategory}', '${g.replace(/'/g, "\\'")}')">${g}</div>`
                    ).join('');
                    showPage('grades');
                } else {
                    showMainPage();
                }
            } else if (target === 'albums') {
                showAlbums();
            } else if (target === 'booksBack') {
                if (window._booksBack === 'albums') {
                    showAlbums();
                } else if (window._booksBack === 'grades') {
                    goBack('grades');
                } else {
                    showMainPage();
                }
            }
        }

        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast ' + type + ' show';
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function showCustomAlert(message, onClose = null) {
            document.getElementById('alertMessage').textContent = message;
            document.getElementById('alertModal').classList.add('active');
            if (onClose) {
                window._alertCallback = onClose;
            } else {
                window._alertCallback = null;
            }
        }

        function closeAlert() {
            document.getElementById('alertModal').classList.remove('active');
            if (window._alertCallback) {
                const cb = window._alertCallback;
                window._alertCallback = null;
                cb();
            }
        }

        function downloadBook(event, link, bookName) {
            window.open(link, '_blank');
            showToast('📥 جاري التحميل', 'success');
        }

        window.onload = () => {
            if (localStorage.getItem('ae_student')) {
                showMainPage();
            } else {
                startScan();
            }
        };

        async function startScan() {
            showPage('scan');
            if (html5QrCode) {
                try { html5QrCode.stop(); } catch (e) {}
            }
            html5QrCode = new Html5Qrcode("reader");
            try {
                await html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 250, height: 250 } },
                    async (code) => {
                        html5QrCode.stop();
                        const id = code.trim();
                        try {
                            const resp = await fetch(SCRIPT_URL + "?action=verify&id=" + id);
                            const data = await resp.json();
                            if (data.exists) {
                                localStorage.setItem('ae_student', id);
                                showToast('✅ تم التحقق بنجاح!', 'success');
                                showMainPage();
                            } else {
                                showCustomAlert('تأكد من صحة الباركود.', () => startScan());
                            }
                        } catch (err) {
                            showCustomAlert('⚠️ خطأ في الاتصال', () => startScan());
                        }
                    },
                    (errorMessage) => { }
                );
            } catch (err) {
                console.error("فشل تشغيل الكاميرا:", err);
                showCustomAlert("تعذر الوصول إلى الكاميرا. تأكد من السماح بالوصول.");
            }
        }

        function logout() {
            localStorage.removeItem('ae_student');
            booksCache = {};
            albumsCache = {};
            showToast('👋 تم تسجيل الخروج', 'success');
            showPage('scan');
            startScan();
        }
    </script>
</body>
</html>
