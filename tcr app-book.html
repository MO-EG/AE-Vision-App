<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AE Vision - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0d1117; --card: #161b22; --accent: #e2b04a; --text: #e6e6e6; --danger: #b22222; --header-bg: #1a1a2e; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; background: var(--header-bg); padding: 16px; border-bottom: 3px solid var(--accent); display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .header .logo-title { display: flex; align-items: center; gap: 12px; }
        .header img { width: 42px; height: 42px; border-radius: 50%; border: 2px solid var(--accent); }
        .header h1 { font-size: 22px; color: var(--accent); }
        .header .actions { display: flex; gap: 8px; }
        .btn { padding: 8px 18px; border-radius: 20px; border: none; cursor: pointer; font-size: 14px; font-weight: bold; transition: transform 0.2s; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-danger { background: var(--danger); color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-edit { background: #007bff; color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
        .btn:hover { transform: scale(1.05); }
        .btn:active { transform: scale(0.95); }
        .container { width: 100%; max-width: 600px; padding: 16px; flex: 1; }
        .login-box { background: var(--card); border-radius: 16px; padding: 30px; margin-top: 50px; text-align: center; }
        .login-box input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #222; color: white; font-family: 'Tajawal', sans-serif; }
        .tabs { display: flex; gap: 8px; margin: 12px 0; }
        .tab-btn { flex: 1; padding: 10px; border-radius: 20px; border: 2px solid transparent; background: var(--card); color: #aaa; cursor: pointer; font-weight: bold; font-family: 'Tajawal', sans-serif; }
        .tab-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(226,176,74,0.1); }
        .filter-row { display: flex; gap: 8px; margin: 8px 0; align-items: center; }
        .filter-select { flex: 1; padding: 10px; border-radius: 20px; background: var(--card); color: var(--text); border: 1px solid #444; font-family: 'Tajawal', sans-serif; }
        .book-card { background: var(--card); border-radius: 12px; padding: 16px; margin: 12px 0; display: flex; align-items: center; gap: 16px; border-right: 4px solid var(--accent); }
        .book-card img { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; background: #333; flex-shrink: 0; }
        .book-info { flex: 1; }
        .book-info h3 { color: var(--accent); margin-bottom: 4px; font-size: 16px; }
        .book-info small { color: #aaa; font-size: 13px; }
        .album-badge { background: rgba(226,176,74,0.2); color: var(--accent); padding: 2px 8px; border-radius: 12px; font-size: 11px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card); border-radius: 16px; padding: 24px; width: 90%; max-width: 450px; max-height: 90vh; overflow-y: auto; }
        .modal-content h2 { color: var(--accent); margin-bottom: 12px; }
        .modal-content input, .modal-content select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; font-family: 'Tajawal', sans-serif; }
        .album-list { margin: 8px 0; }
        .album-item { background: rgba(255,255,255,0.05); border-radius: 10px; padding: 10px 14px; margin: 6px 0; display: flex; justify-content: space-between; align-items: center; }
        .album-name { font-weight: bold; }
        .album-actions { display: flex; gap: 6px; }
        .empty-state { text-align: center; color: #aaa; padding: 30px 0; }
        @media (max-width: 480px) {
            .book-card { flex-wrap: wrap; }
            .book-card img { width: 60px; height: 60px; }
        }
    </style>
</head>
<body>
    <div id="loginPage">
        <div class="container">
            <div class="login-box">
                <h2>مرحباً بك</h2>
                <input type="text" id="username" placeholder="Username">
                <input type="password" id="password" placeholder="Password">
                <button class="btn btn-primary" style="width:100%; margin-top:16px; padding:12px;" onclick="login()">دخول</button>
            </div>
        </div>
    </div>

    <div id="adminPage" style="display:none; width:100%;">
        <div class="header">
            <div class="logo-title">
                <img src="logo.png" alt="Logo" onerror="this.style.display='none'">
                <h1>📚 إدارة الكتب</h1>
            </div>
            <div class="actions">
                <button class="btn btn-outline" onclick="showAlbumsTab()">🗂 الألبومات</button>
                <button class="btn btn-danger" onclick="logout()">🚪 خروج</button>
            </div>
        </div>
        <div class="container">
            <div class="tabs">
                <button class="tab-btn active" id="booksTabBtn" onclick="showBooksTab()">الكتب</button>
                <button class="tab-btn" id="albumsTabBtn" onclick="showAlbumsTab()">الألبومات</button>
            </div>
            <div id="booksTab">
                <div class="filter-row">
                    <select class="filter-select" id="albumFilter" onchange="loadBooks()">
                        <option value="">كل الكتب</option>
                    </select>
                    <button class="btn btn-primary" onclick="openModal()">➕ إضافة كتاب</button>
                </div>
                <div id="booksList"></div>
            </div>
            <div id="albumsTab" style="display:none;">
                <button class="btn btn-success" style="width:100%; margin:12px 0;" onclick="openAlbumModal()">➕ إنشاء ألبوم جديد</button>
                <div id="albumsList"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="bookModal">
        <div class="modal-content">
            <h2 id="modalTitle">📘 إضافة كتاب جديد</h2>
            <input type="text" id="bookName" placeholder="اسم الكتاب">
            <input type="url" id="bookImage" placeholder="رابط الصورة (اختياري)">
            <input type="url" id="bookLink" placeholder="رابط التحميل">
            <select id="category" onchange="updateGrades()">
                <option value="">اختر التصنيف</option>
                <option value="primary">ابتدائي</option>
                <option value="prep">اعدادي</option>
                <option value="secondary">ثانوي</option>
            </select>
            <select id="grade" disabled><option value="">اختر الصف</option></select>
            <select id="albumId">
                <option value="">بدون ألبوم</option>
                <!-- سيتم تعبئته -->
            </select>
            <input type="hidden" id="editId">
            <button class="btn btn-success" style="width:100%; margin-top:12px; padding:12px;" onclick="saveBook()">💾 حفظ</button>
            <button class="btn" style="width:100%; margin-top:8px; background:#555;" onclick="closeModal()">إلغاء</button>
        </div>
    </div>

    <div class="modal" id="albumModal">
        <div class="modal-content">
            <h2 id="albumModalTitle">🗂 ألبوم جديد</h2>
            <input type="text" id="albumName" placeholder="اسم الألبوم">
            <input type="hidden" id="editAlbumId">
            <button class="btn btn-success" style="width:100%; margin-top:12px; padding:12px;" onclick="saveAlbum()">💾 حفظ</button>
            <button class="btn" style="width:100%; margin-top:8px; background:#555;" onclick="closeAlbumModal()">إلغاء</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyis7KXF90SgojdxtzLg1IB5waVITn3ktHUUUjBz8StQxatSE-tZySlify8oPGXj2J5/exec";
        const ADMIN_USER = "A.3tef";
        const ADMIN_PASS = "a241988";

        const gradesMap = {
            primary: ["4 ابتدائي", "5 ابتدائي", "6 ابتدائي"],
            prep: ["1 اعدادي", "2 اعدادي", "3 اعدادي"],
            secondary: ["1 ثانوي", "2 ثانوي", "3 ثانوي"]
        };

        window.onload = () => {
            if (localStorage.getItem('ae_admin')) {
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('adminPage').style.display = 'block';
                loadAlbums();
                loadBooks();
            }
        };

        function login() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            if (u === ADMIN_USER && p === ADMIN_PASS) {
                localStorage.setItem('ae_admin', 'true');
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('adminPage').style.display = 'block';
                loadAlbums();
                loadBooks();
            } else {
                alert("❌ بيانات خاطئة");
            }
        }

        function logout() { 
            localStorage.removeItem('ae_admin'); 
            location.reload(); 
        }

        function showBooksTab() {
            document.getElementById('booksTab').style.display = 'block';
            document.getElementById('albumsTab').style.display = 'none';
            document.getElementById('booksTabBtn').classList.add('active');
            document.getElementById('albumsTabBtn').classList.remove('active');
        }

        function showAlbumsTab() {
            document.getElementById('booksTab').style.display = 'none';
            document.getElementById('albumsTab').style.display = 'block';
            document.getElementById('booksTabBtn').classList.remove('active');
            document.getElementById('albumsTabBtn').classList.add('active');
            loadAlbums();
        }

        function updateGrades() {
            const cat = document.getElementById('category').value;
            const g = document.getElementById('grade');
            g.innerHTML = '<option value="">اختر الصف</option>';
            if (cat) gradesMap[cat].forEach(gr => g.innerHTML += `<option>${gr}</option>`);
            g.disabled = !cat;
        }


        async function loadAlbums() {
            try {
                const resp = await fetch(SCRIPT_URL + "?action=getAlbums");
                const albums = await resp.json();
                
                const filter = document.getElementById('albumFilter');
                const albumSelect = document.getElementById('albumId');
                filter.innerHTML = '<option value="">كل الكتب</option>';
                albumSelect.innerHTML = '<option value="">بدون ألبوم</option>';
                albums.forEach(album => {
                    filter.innerHTML += `<option value="${album.id}">${album.name}</option>`;
                    albumSelect.innerHTML += `<option value="${album.id}">${album.name}</option>`;
                });
               
                const list = document.getElementById('albumsList');
                if (!albums.length) {
                    list.innerHTML = '<div class="empty-state">لا توجد ألبومات بعد</div>';
                    return;
                }
                list.innerHTML = albums.map(album => `
                    <div class="album-item">
                        <span class="album-name">🗂 ${album.name}</span>
                        <div class="album-actions">
                            <button class="btn btn-edit" onclick="editAlbum('${album.id}', '${album.name.replace(/'/g, "\\'")}')">✏️</button>
                            <button class="btn btn-danger" onclick="deleteAlbum('${album.id}')">🗑</button>
                        </div>
                    </div>
                `).join('');
            } catch (e) {
                console.error(e);
                alert("فشل تحميل الألبومات");
            }
        }

        function openAlbumModal() {
            document.getElementById('editAlbumId').value = '';
            document.getElementById('albumName').value = '';
            document.getElementById('albumModalTitle').textContent = '🗂 ألبوم جديد';
            document.getElementById('albumModal').classList.add('active');
        }

        function editAlbum(id, name) {
            document.getElementById('editAlbumId').value = id;
            document.getElementById('albumName').value = name;
            document.getElementById('albumModalTitle').textContent = '✏️ تعديل الألبوم';
            document.getElementById('albumModal').classList.add('active');
        }

        function closeAlbumModal() {
            document.getElementById('albumModal').classList.remove('active');
        }

        async function saveAlbum() {
            const id = document.getElementById('editAlbumId').value;
            const name = document.getElementById('albumName').value.trim();
            if (!name) { alert("يرجى إدخال اسم الألبوم"); return; }
            const data = { action: id ? 'updateAlbum' : 'createAlbum', id, name };
            try {
                await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
                closeAlbumModal();
                loadAlbums();
            } catch (e) { alert("فشل الحفظ"); }
        }

        async function deleteAlbum(id) {
            if (confirm('هل أنت متأكد من حذف الألبوم؟ لن يتم حذف الكتب بداخله.')) {
                await fetch(SCRIPT_URL + "?action=deleteAlbum&id=" + id);
                loadAlbums();
                loadBooks();
            }
        }


        async function loadBooks() {
            const albumId = document.getElementById('albumFilter').value;
            let url = SCRIPT_URL + "?action=getBooks";
            if (albumId) url += "&albumId=" + albumId;
            try {
                const resp = await fetch(url);
                const books = await resp.json();
                const container = document.getElementById('booksList');
                if (!books.length) {
                    container.innerHTML = '<div class="empty-state">لا توجد كتب</div>';
                    return;
                }
                container.innerHTML = books.map(b => {
                    const imgSrc = b.image || 'logo.png';
                    const albumBadge = b.albumName ? `<span class="album-badge">🗂 ${b.albumName}</span>` : '';
                    return `
                    <div class="book-card">
                        <img src="${imgSrc}" onerror="this.src='logo.png'" alt="صورة الكتاب">
                        <div class="book-info">
                            <h3>${b.name} ${albumBadge}</h3>
                            <small>${b.category === 'primary' ? 'ابتدائي' : b.category === 'prep' ? 'اعدادي' : 'ثانوي'} - ${b.grade}</small>
                        </div>
                        <button class="btn btn-edit" onclick="editBook('${b.id}')">✏️</button>
                        <button class="btn btn-danger" onclick="deleteBook('${b.id}')">🗑</button>
                    </div>`;
                }).join('');
            } catch (e) {
                alert("فشل تحميل الكتب");
            }
        }

        async function openModal(bookId = null) {
            await loadAlbums();
            if (bookId) {
                const resp = await fetch(SCRIPT_URL + "?action=getBooks");
                const books = await resp.json();
                const book = books.find(b => b.id == bookId);
                if (book) {
                    document.getElementById('editId').value = book.id;
                    document.getElementById('bookName').value = book.name;
                    document.getElementById('bookImage').value = book.image || '';
                    document.getElementById('bookLink').value = book.link;
                    document.getElementById('category').value = book.category;
                    updateGrades();
                    document.getElementById('grade').value = book.grade;
                    document.getElementById('albumId').value = book.albumId || '';
                    document.getElementById('modalTitle').textContent = '✏️ تعديل كتاب';
                }
            } else {
                document.getElementById('editId').value = '';
                document.getElementById('bookName').value = '';
                document.getElementById('bookImage').value = '';
                document.getElementById('bookLink').value = '';
                document.getElementById('category').value = '';
                document.getElementById('grade').innerHTML = '<option value="">اختر الصف</option>';
                document.getElementById('grade').disabled = true;
                document.getElementById('albumId').value = '';
                document.getElementById('modalTitle').textContent = '📘 إضافة كتاب جديد';
            }
            document.getElementById('bookModal').classList.add('active');
        }

        function editBook(id) { openModal(id); }
        function closeModal() { document.getElementById('bookModal').classList.remove('active'); }

        async function saveBook() {
            const id = document.getElementById('editId').value;
            const name = document.getElementById('bookName').value.trim();
            const image = document.getElementById('bookImage').value.trim();
            const link = document.getElementById('bookLink').value.trim();
            const category = document.getElementById('category').value;
            const grade = document.getElementById('grade').value;
            const albumId = document.getElementById('albumId').value;

            if (!name || !link || !category || !grade) {
                alert("يرجى ملء جميع الحقول المطلوبة");
                return;
            }

            const bookData = { id, name, image, link, category, grade, albumId, action: id ? 'update' : 'create' };
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(bookData) });
            closeModal();
            loadBooks();
        }

        async function deleteBook(id) {
            if (confirm('هل أنت متأكد من الحذف؟')) {
                await fetch(SCRIPT_URL + "?action=deleteBook&id=" + id);
                loadBooks();
            }
        }
    </script>
</body>
</html>
