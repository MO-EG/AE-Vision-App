<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AE Vision - Admin</title>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --accent: #e2b04a; --text: #e6e6e6; --header-bg: #1a1a2e; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .header { width: 100%; background: var(--header-bg); padding: 16px; border-bottom: 3px solid var(--accent); display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 24px; color: var(--accent); }
        .btn { padding: 8px 18px; border-radius: 20px; border: none; cursor: pointer; font-size: 14px; font-weight: bold; }
        .btn-primary { background: var(--accent); color: #000; }
        .btn-danger { background: #b22222; color: white; }
        .btn-success { background: #28a745; color: white; }
        .btn-edit { background: #007bff; color: white; }
        .container { width: 100%; max-width: 600px; padding: 16px; flex: 1; }
        .login-box { background: var(--card); border-radius: 16px; padding: 30px; margin-top: 50px; text-align: center; }
        .login-box input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #333; background: #222; color: white; }
        .book-card { background: var(--card); border-radius: 12px; padding: 16px; margin: 12px 0; display: flex; align-items: center; gap: 16px; }
        .book-card img { width: 90px; height: 90px; border-radius: 8px; object-fit: cover; }
        .book-info { flex: 1; }
        .book-info h3 { color: var(--accent); margin-bottom: 4px; }
        .book-info small { color: #aaa; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card); border-radius: 16px; padding: 24px; width: 90%; max-width: 450px; }
        .modal-content input, .modal-content select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; }
    </style>
</head>
<body>
    
    <div id="loginPage" style="width:100%;">
        <div class="header"><h1>🔐 تسجيل الدخول</h1></div>
        <div class="container">
            <div class="login-box">
                <h2>مرحباً بك</h2>
                <input type="text" id="username" placeholder="3tef">
                <input type="password" id="password" placeholder="241988">
                <button class="btn btn-primary" style="width:100%; margin-top:16px;" onclick="login()">دخول</button>
            </div>
        </div>
    </div>
    <div id="adminPage" style="display:none; width:100%;">
        <div class="header">
            <button class="btn btn-primary" onclick="openModal()">➕ إنشاء جديد</button>
            <h1>📚 إدارة الكتب</h1>
            <button class="btn btn-danger" onclick="logout()">🚪 خروج</button>
        </div>
        <div class="container" id="booksList"></div>
    </div>
    
    <div class="modal" id="bookModal">
        <div class="modal-content">
            <h2 id="modalTitle">📘 إضافة كتاب جديد</h2>
            <input type="text" id="bookName" placeholder="اسم الكتاب">
            <input type="url" id="bookImage" placeholder="رابط الصورة">
            <input type="url" id="bookLink" placeholder="رابط التحميل">
            <select id="category" onchange="updateGrades()">
                <option value="">اختر التصنيف</option>
                <option value="primary">ابتدائي</option>
                <option value="prep">اعدادي</option>
                <option value="secondary">ثانوي</option>
            </select>
            <select id="grade" disabled><option value="">اختر الصف</option></select>
            <input type="hidden" id="editId">
            <button class="btn btn-success" style="width:100%; margin-top:12px;" onclick="saveBook()">💾 حفظ</button>
            <button class="btn" style="width:100%; margin-top:8px; background:#555;" onclick="closeModal()">إلغاء</button>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec";
        const ADMIN_USER = "admin";
        const ADMIN_PASS = "ae123456";

        const gradesMap = {
            primary: ["4 ابتدائي", "5 ابتدائي", "6 ابتدائي"],
            prep: ["1 اعدادي", "2 اعدادي", "3 اعدادي"],
            secondary: ["1 ثانوي", "2 ثانوي", "3 ثانوي"]
        };

        window.onload = () => {
            if (localStorage.getItem('ae_admin')) { document.getElementById('loginPage').style.display = 'none'; document.getElementById('adminPage').style.display = 'block'; loadBooks(); }
        };

        function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if (u === ADMIN_USER && p === ADMIN_PASS) {
                localStorage.setItem('ae_admin', 'true');
                document.getElementById('loginPage').style.display = 'none';
                document.getElementById('adminPage').style.display = 'block';
                loadBooks();
            } else { alert("❌ بيانات خاطئة"); }
        }

        function logout() { localStorage.removeItem('ae_admin'); location.reload(); }

        function updateGrades() {
            const cat = document.getElementById('category').value;
            const g = document.getElementById('grade');
            g.innerHTML = '<option value="">اختر الصف</option>';
            if (cat) gradesMap[cat].forEach(gr => g.innerHTML += `<option>${gr}</option>`);
            g.disabled = !cat;
        }

        async function loadBooks() {
            const resp = await fetch(SCRIPT_URL + "?action=getBooks");
            const books = await resp.json();
            document.getElementById('booksList').innerHTML = books.map(b => `
                <div class="book-card">
                    <img src="${b.image}" onerror="this.src='logo.png'">
                    <div class="book-info">
                        <h3>${b.name}</h3>
                        <small>${b.category === 'primary' ? 'ابتدائي' : b.category === 'prep' ? 'اعدادي' : 'ثانوي'} - ${b.grade}</small>
                    </div>
                    <button class="btn btn-edit" onclick="editBook('${b.id}', '${b.name}', '${b.image}', '${b.link}', '${b.category}', '${b.grade}')">✏️</button>
                    <button class="btn btn-danger" onclick="deleteBook('${b.id}')">🗑</button>
                </div>
            `).join('');
        }

        function openModal(id = '', name = '', image = '', link = '', category = '', grade = '') {
            document.getElementById('editId').value = id;
            document.getElementById('bookName').value = name;
            document.getElementById('bookImage').value = image;
            document.getElementById('bookLink').value = link;
            document.getElementById('category').value = category;
            updateGrades();
            document.getElementById('grade').value = grade;
            document.getElementById('modalTitle').textContent = id ? '✏️ تعديل كتاب' : '📘 إضافة كتاب جديد';
            document.getElementById('bookModal').classList.add('active');
        }

        function editBook(id, name, image, link, category, grade) {
            openModal(id, name, image, link, category, grade);
        }

        function closeModal() { document.getElementById('bookModal').classList.remove('active'); }

        async function saveBook() {
            const data = {
                id: document.getElementById('editId').value,
                name: document.getElementById('bookName').value,
                image: document.getElementById('bookImage').value,
                link: document.getElementById('bookLink').value,
                category: document.getElementById('category').value,
                grade: document.getElementById('grade').value,
                action: document.getElementById('editId').value ? 'update' : 'create'
            };
            await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data) });
            closeModal();
            loadBooks();
        }

        async function deleteBook(id) {
            if (confirm('هل أنت متأكد من الحذف؟')) {
                await fetch(SCRIPT_URL + "?action=deleteBook&id=" + id);
                loadBooks();
            }
        }
    </script>
</body>
</html>
